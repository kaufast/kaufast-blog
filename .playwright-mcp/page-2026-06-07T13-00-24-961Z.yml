    - 'img "Echoflicks: AI Cites Us 7 Days After Launch" [ref=e27]'
    - generic [ref=e28]:
      - paragraph [ref=e29]:
        - text: We launched
        - emphasis [ref=e30]:
          - link "Echoflicks" [ref=e31] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: a week ago. No press. No ads. No Product Hunt launch. A landing page and a WhatsApp bot in Barcelona.
      - paragraph [ref=e32]:
        - text: This was a team effort from day one. Jason and Jonny, the founders of
        - emphasis [ref=e33]:
          - link "Echoflicks" [ref=e34] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: ", brought the product vision and the creative direction. We at"
        - link "KAUFAST" [ref=e35] [cursor=pointer]:
          - /url: https://kaufast.com/en-GB/projects/echoflicks
        - text: handled the technical SEO, schema architecture, performance engineering, and
        - link "AI search optimisation" [ref=e36] [cursor=pointer]:
          - /url: /en-GB/insights/is-your-business-visible-to-chatgpt-how-to-check
        - text: . Their team built the product. Our team made sure the machines could find it. That collaboration is the reason this story exists.
      - paragraph [ref=e37]: Then someone asked ChatGPT about us.
      - paragraph [ref=e38]: It didn't just mention us. It wrote five paragraphs. It described our product, our process, our positioning, even our keyword strategy. It told people what makes us different — that we're not selling AI video creation, we're selling the emotional outcome of turning memories into movies. It listed our competitors. It offered to analyse our revenue model.
      - paragraph [ref=e39]: We didn't brief it. We didn't submit anything. We didn't pay for AI SEO tools. One week in, and the machine already knows who we are, what we do, and why it matters.
      - paragraph [ref=e40]: Google's AI Overview does the same thing. Google indexed us within days. Seven days from zero to cited — across traditional search, AI Overviews, and conversational AI.
      - paragraph [ref=e41]: This is the story of how that happened — and what we think it means for anyone launching something new.
      - paragraph [ref=e42]:
        - img "Google Search results for Echoflicks showing first position ranking with knowledge panel" [ref=e43]
        - emphasis [ref=e44]: Google Search results for "echoflicks" — June 2, 2026. First position with knowledge panel, Instagram, Facebook, and LinkedIn all indexed.
      - paragraph [ref=e45]:
        - img "Google AI Overview generating a full product description of Echoflicks" [ref=e46]
        - emphasis [ref=e47]: Google AI Overview — June 2, 2026. Full product description generated from our website content, citing 4 sources.
      - heading "How Sitting Between Categories Gets You Cited by AI" [level=2] [ref=e48]
      - paragraph [ref=e49]: Most startups launch into an existing category and fight for position. AI video editor. Photo slideshow maker. Those searches have thousands of results, millions of ad dollars behind them, and a decade of SEO moats built by incumbents.
      - paragraph [ref=e50]: We didn't enter any of those categories. Instead, we built a product that sits at the exact intersection of existing semantic clusters.
      - paragraph [ref=e51]: There is no other product where you message an AI filmmaker on WhatsApp, send him your holiday photos, and get a cinematic movie back in twenty minutes. Nobody else does that. Not Canva. Not CapCut. Not Luma. Not Runway.
      - paragraph [ref=e52]: "When ChatGPT categorised us, it didn't invent a new industry — it mapped us across five existing nodes: AI video generation, consumer photo products, memory preservation, family storytelling, and personalised gifts. We became the missing link between them."
      - paragraph [ref=e53]: That matters because of how large language models retrieve information. When someone asks "can I turn my photos into a movie on WhatsApp," the model searches its training data and any retrieved sources for the most relevant answer. If there are ten thousand competing pages, you're fighting for a mention. If there's one page that exactly matches the intersection of those concepts — you're the answer.
      - paragraph [ref=e54]:
        - text: We didn't
        - link "optimise for general AI search" [ref=e55] [cursor=pointer]:
          - /url: /en-GB/insights/optimise-for-bing-duckduckgo-perplexity-claude
        - text: . We built something specific enough that when someone describes the use-case, they are exclusively describing us.
        - strong [ref=e56]: The niche is the strategy.
      - heading "What ChatGPT Actually Said About Us" [level=2] [ref=e57]
      - paragraph [ref=e58]:
        - text: This is what ChatGPT returns when someone asks about
        - emphasis [ref=e59]:
          - link "Echoflicks" [ref=e60] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: "— one week after launch, no prompting, no paid placement:"
      - blockquote [ref=e61]:
        - paragraph [ref=e62]:
          - text: "\""
          - emphasis [ref=e63]:
            - link "Echoflicks" [ref=e64] [cursor=pointer]:
              - /url: https://echoflicks.com
          - text: is a Barcelona-based AI storytelling platform that turns your personal photos and videos into short cinematic movies called 'Echoes.' Instead of using a video editor, you send 15–25 photos to an AI filmmaker named Felix through WhatsApp, answer a few questions, and receive a professionally produced mini-movie back in around 20 minutes."
      - paragraph [ref=e65]:
        - text: "It goes further. It describes the technical specs — script, voiceover, soundtrack, colour grading, titles. It explains the positioning:"
        - emphasis [ref=e66]:
          - text: "\"Most AI video tools start with text prompts."
          - link "Echoflicks" [ref=e67] [cursor=pointer]:
            - /url: https://echoflicks.com
          - text: starts with real memories."
        - text: It even suggests keywords we should target and offers to analyse our strengths and weaknesses.
      - paragraph [ref=e68]: Read that again. An AI — without being asked by us, without being fed a press release, without any backlink strategy — wrote a competitive analysis of our business. In week one.
      - paragraph [ref=e69]: How?
      - heading "How Plain Language Improves AI Search Visibility" [level=2] [ref=e70]
      - paragraph [ref=e71]:
        - text: "Our website says what we do in one sentence:"
        - strong [ref=e72]: "\"Send 20 photos to Felix in WhatsApp. Get a cinematic movie back in minutes.\""
      - paragraph [ref=e73]: That's not a tagline we workshopped for six weeks. It's a literal description of the product. And it turns out that's exactly what AI retrieval systems — whether they use RAG pipelines, Google's Search Generative Experience, or direct model knowledge — need to cite you.
      - paragraph [ref=e74]: "AI doesn't reward clever copy. It rewards clarity. When a model is generating a response and looking for a source to reference, it needs content it can extract and paraphrase accurately. Compare these two approaches:"
      - paragraph [ref=e75]:
        - strong [ref=e76]: "Don't:"
        - emphasis [ref=e77]: "\"Unlock the power of your visual memories with our AI-driven content transformation platform.\""
      - paragraph [ref=e78]:
        - strong [ref=e79]: "Do:"
        - emphasis [ref=e80]: "\"Send your photos to Felix on WhatsApp. He writes a script, scores original music, colour grades your shots, and sends back a 60-second cinematic movie.\""
      - paragraph [ref=e81]: The first one is marketing. The second one is information. AI models cite information.
      - paragraph [ref=e82]: Every section of our site follows this principle. The "How It Works" section is three steps. The FAQ has eight questions with one-sentence answers. We wrote our website like a Wikipedia article that happens to have good design. Declarative. Specific. Quotable.
      - heading "Why FAQ Sections Are Critical for AI Search Visibility" [level=2] [ref=e83]
      - paragraph [ref=e84]:
        - text: FAQ is not the only thing that matters — but it's one of the highest-leverage things you can do.
        - strong [ref=e85]:
          - text: A well-structured FAQ section is one of the most effective tools for
          - link "generative engine optimisation" [ref=e86] [cursor=pointer]:
            - /url: /en-GB/insights/seo-isnt-dead-ai-brain-hybrid-visibility-guide-2026
        - text: ", and here's why."
      - paragraph [ref=e87]: Large language models are trained on — and actively retrieve — question-answer pairs. That's a format they handle exceptionally well. When someone asks an AI a question, it looks for content that's already structured as a question with a clear answer. Your FAQ doesn't just feed information to the model — it gives the model a pattern it can synthesise from, weigh heavily, and paraphrase with confidence.
      - paragraph [ref=e88]: "Our eight FAQs cover:"
      - list [ref=e89]:
        - listitem [ref=e90]:
          - strong [ref=e91]: Do I need an app?
          - text: No, it's WhatsApp
        - listitem [ref=e92]:
          - strong [ref=e93]: How long?
          - text: 20 minutes
        - listitem [ref=e94]:
          - strong [ref=e95]: How much?
          - text: Free, then €9/month
        - listitem [ref=e96]:
          - strong [ref=e97]: What kind of films?
          - text: 60-second cinematic movies with narration and original music
        - listitem [ref=e98]:
          - strong [ref=e99]: What about privacy?
          - text: EU servers, never used for training
        - listitem [ref=e100]:
          - strong [ref=e101]: Can I use it as a gift?
          - text: "Yes"
        - listitem [ref=e102]:
          - strong [ref=e103]: What photos work?
          - text: Anything from your camera roll, 15–25
        - listitem [ref=e104]:
          - strong [ref=e105]: Does it generate fake images?
          - text: No, only your real photos
      - paragraph [ref=e106]: Every single one of those showed up — paraphrased, synthesised, or directly referenced — in ChatGPT's description of us. The Q&A structure gave the model high-confidence source material to work with.
      - paragraph [ref=e107]: But FAQ alone doesn't get you cited. The FAQ worked because it sat on top of a fully optimised technical stack — server-side rendering, JSON-LD schema markup, sub-second load times, and semantic HTML. Each layer reinforces the others. The FAQ gave AI models the content format they prefer. The schema told them what the content means. The performance ensured they could access it instantly.
      - heading "How Technical SEO Fundamentals Drive AI Indexing Speed" [level=2] [ref=e108]
      - paragraph [ref=e109]: This happened in seven days. Traditional SEO wisdom would tell you to wait three to six months for a new domain to build authority. We didn't wait. We didn't need to.
      - paragraph [ref=e110]: This is where the behind-the-curtain work matters. The visible content is what AI models cite. But the technical infrastructure is what makes that content discoverable in the first place. Jason and Jonny's team focused on building the product. We focused on making every machine on the internet — crawlers, LLMs, retrieval systems — able to find it, read it, and cite it.
      - paragraph [ref=e111]:
        - text: We were rigorous about
        - strong [ref=e112]:
          - link "technical SEO fundamentals" [ref=e113] [cursor=pointer]:
            - /url: /en-GB/insights/seo-strategies-that-actually-work
        - text: — the infrastructure that makes content discoverable by any machine, whether it's a traditional crawler or an LLM retrieval system.
      - paragraph [ref=e114]:
        - strong [ref=e115]: Server-side rendering.
        - text: When Google's crawler hit our site, it got a complete HTML document on the first request. Not a blank
        - code [ref=e116]: <div id="root">
        - text: that waits for JavaScript to hydrate. The crawler reads it, indexes it, and moves on. This matters equally for RAG systems that pull from web indexes — if your content isn't in the HTML, it doesn't exist.
      - paragraph [ref=e117]:
        - strong [ref=e118]: Two real URLs per language.
        - text: We support English and Spanish. Each language is a real, server-rendered page with its own URL. Google sees two pages, each with its own proper hreflang links pointing to the other. No ambiguity.
      - paragraph [ref=e119]:
        - strong [ref=e120]: Semantic HTML.
        - text: Proper heading hierarchy. Alt text on every image. The markup reads like a document because it is one. This gives both crawlers and LLMs a clean content tree to parse.
      - paragraph [ref=e121]:
        - strong [ref=e122]: Schema markup and structured data.
        - text: We implemented JSON-LD schema — Organization, WebSite, and structured product information — so search engines and AI systems don't have to guess what the page is about. Schema markup is the difference between a crawler reading your content and a crawler
        - emphasis [ref=e123]: understanding
        - text: your content. It tells Google and AI retrieval systems exactly what entities exist on the page, how they relate, and what the page is for.
      - paragraph [ref=e124]:
        - strong [ref=e125]: Performance on GCP.
        - text: The site is hosted on Google Cloud Platform, optimised for sub-second load times on mobile. 95+ Lighthouse Performance, 100 Accessibility, 100 Best Practices, 100 SEO. Google
        - link "allocates crawl budget based on speed" [ref=e126] [cursor=pointer]:
          - /url: /en-GB/insights/why-site-speed-affects-seo
        - text: . Fast sites get indexed faster — and when you're a new domain competing against zero, every hour of indexing speed matters.
      - paragraph [ref=e127]:
        - strong [ref=e128]: Google Search Console from day one.
        - text: We submitted the sitemap, requested indexing for every URL through the URL Inspection tool, and monitored crawl activity in real time. We didn't wait for Google to discover us. We told Google where to look and verified it was looking.
      - paragraph [ref=e129]:
        - strong [ref=e130]: The full stack matters.
        - text: None of these things work in isolation. FAQ without schema is less effective. Schema without fast rendering is slower to index. Fast rendering without plain-language content gives AI nothing to cite. The reason
        - emphasis [ref=e131]:
          - link "Echoflicks" [ref=e132] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: got cited in seven days is that every layer of the stack — content, structure, markup, performance, and infrastructure — was built to work together.
      - heading "The Emotional Outcome Is the Keyword" [level=2] [ref=e133]
      - paragraph [ref=e134]: "ChatGPT's analysis of our positioning included something we didn't expect:"
      - blockquote [ref=e135]:
        - paragraph [ref=e136]: "\"The strongest differentiator is that they are not selling 'AI video creation'; they are selling the emotional outcome: turning memories into movies.\""
      - paragraph [ref=e137]: This is the shift that matters. We didn't ignore keyword research; we completely redefined it. We traded high-volume functional keywords ("AI video editor") for high-intent outcome phrasing ("turn photos into cinematic movie").
      - paragraph [ref=e138]: We don't describe a tool. We describe what happens to you. Your photos become a movie. Your memories come alive. You press play and you feel something.
      - paragraph [ref=e139]:
        - text: That emotional framing doesn't just work for humans — it works for AI too. When ChatGPT describes us, it doesn't say "
        - emphasis [ref=e140]:
          - link "Echoflicks" [ref=e141] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: is an AI video editor." It says
        - emphasis [ref=e142]:
          - link "Echoflicks" [ref=e143] [cursor=pointer]:
            - /url: https://echoflicks.com
        - emphasis [ref=e144]: turns personal photos into cinematic movies
        - text: . It understood the emotional pitch because the emotional pitch was the only pitch on the page.
      - paragraph [ref=e145]: If your website describes features, AI will list you alongside every other feature-based competitor. If your website describes outcomes, AI will explain why you're different.
      - heading "What This Means for Anyone Launching" [level=2] [ref=e146]
      - paragraph [ref=e147]: You don't need a domain authority of 80. You don't need backlinks from TechCrunch. You don't need three months of content marketing before AI notices you.
      - paragraph [ref=e148]: "You need five things working together:"
      - paragraph [ref=e149]:
        - strong [ref=e150]: 1. Be specific.
        - text: Do one thing that nobody else does in exactly the way you do it. AI can't cite you if you sound like everyone else.
      - paragraph [ref=e151]:
        - strong [ref=e152]: 2. Say it plainly.
        - text: Write your site like you're explaining your product to a smart friend. No jargon. No abstractions. Declarative sentences that a retrieval system can extract and an LLM can paraphrase with confidence.
      - paragraph [ref=e153]:
        - strong [ref=e154]: 3. Structure it for questions.
        - text: Add an FAQ. Make the answers direct. One question, one answer, no hedging. FAQ sections are one of the highest-leverage things you can do for AI visibility — but they're not the only thing.
      - paragraph [ref=e155]:
        - strong [ref=e156]: 4. Build the technical stack.
        - text: Schema markup, server-side rendering, sub-second load times, semantic HTML, structured data. The behind-the-curtain work is what makes everything else discoverable. Content without infrastructure is invisible.
      - paragraph [ref=e157]:
        - strong [ref=e158]: 5. Make it a team effort.
        - text: This didn't happen because one person did one thing well. Jason and Jonny brought the vision for
        - emphasis [ref=e159]:
          - link "Echoflicks" [ref=e160] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: and knew their product inside out. Their team built the experience. We brought the technical SEO, the schema architecture, the performance engineering, and the AI search strategy. The best results happen when the people who know the product work alongside the people who know the machines. Always.
      - paragraph [ref=e161]:
        - text: We launched a landing page in Barcelona seven days ago. We have no PR team, no backlinks, no ad spend. And when you ask the world's most-used AI what
        - emphasis [ref=e162]:
          - link "Echoflicks" [ref=e163] [cursor=pointer]:
            - /url: https://echoflicks.com
        - text: is, it writes a better description of our product than we could. When Google generates an AI Overview, it cites us from four sources.
      - paragraph [ref=e164]:
        - strong [ref=e165]: The machines are listening. Just say something worth repeating — and build the infrastructure so they can hear you.
      - paragraph [ref=e166]:
        - text: See the
        - link "full Echoflicks project on KAUFAST" [ref=e167] [cursor=pointer]:
          - /url: https://kaufast.com/en-GB/projects/echoflicks
          - text: full
          - emphasis [ref=e168]: Echoflicks
          - text: project on KAUFAST
        - text: .
    - generic [ref=e169]:
      - heading "Frequently Asked Questions" [level=2] [ref=e170]
      - generic [ref=e171]:
        - generic [ref=e172]:
          - term [ref=e173]: What is Generative Engine Optimisation (GEO)?
          - definition [ref=e174]: GEO is the practice of optimising website content so it gets cited by AI models like ChatGPT, Google AI Overview, and Perplexity. It focuses on plain language, FAQ structures, semantic clarity, and technical infrastructure — making content easy for LLMs to extract, paraphrase, and cite.
        - generic [ref=e175]:
          - term [ref=e176]: How did Echoflicks get cited by ChatGPT in 7 days?
          - definition [ref=e177]: The Echoflicks founding team worked with KAUFAST to build a fast, server-rendered website with declarative plain-language descriptions, structured FAQ pairs, JSON-LD schema markup, semantic HTML, proper hreflang tags, and sub-second load times on GCP infrastructure. The product also occupied a unique niche — AI filmmaker via WhatsApp — meaning there was no competing content for models to choose from.
        - generic [ref=e178]:
          - term [ref=e179]: Do you need backlinks to appear in AI search results?
          - definition [ref=e180]: No. Echoflicks had zero backlinks when ChatGPT and Google AI Overview began citing it. AI models prioritise content clarity, structural formatting (especially Q&A pairs), and topical uniqueness over traditional authority signals like backlinks.
        - generic [ref=e181]:
          - term [ref=e182]: What makes a website visible to AI search engines?
          - definition [ref=e183]: "A combination of factors working together: plain-language content AI can extract and paraphrase, FAQ sections structured as Q&A pairs, proper schema markup (JSON-LD), fast server-side rendering, semantic HTML, and a unique niche position. No single factor works alone — it's the full technical and content stack that earns AI citations."
        - generic [ref=e184]:
          - term [ref=e185]: How fast does Google index a new website in 2026?
          - definition [ref=e186]: With proper technical SEO — server-side rendering, submitted sitemap, fast load times, and semantic HTML — Google can index a new site within days. Echoflicks was indexed in Google Search and Google AI Overview within 7 days of launch.
